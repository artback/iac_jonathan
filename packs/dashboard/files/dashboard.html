<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B1120'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%235B8CFF' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%235B8CFF'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B1120;
            --surface: #151D2E;
            --surface-hover: #1C2740;
            --border: #273349;
            --text: #E7EDF6;
            --muted: #8A99B0;
            --accent: #5B8CFF;
            --accent-dim: rgba(91, 140, 255, 0.14);
            --mono: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scrollbar-gutter: stable; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner {
            max-width: 1240px;
            margin: 0 auto;
            padding: 14px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .wordmark {
            display: flex;
            align-items: baseline;
            gap: 12px;
            white-space: nowrap;
        }

        .wordmark h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .wordmark .host {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--muted);
        }

        .cmdbar {
            position: relative;
            flex: 1;
            max-width: 640px;
            margin-left: auto;
        }

        .cmdbar .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .cmdbar input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 76px 10px 40px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .cmdbar input::placeholder { color: var(--muted); }

        .cmdbar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .cmdbar .hint {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 6px;
            pointer-events: none;
        }

        kbd {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 2px 6px;
        }

        main {
            max-width: 1240px;
            margin: 0 auto;
            padding: 20px 32px 64px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 40px;
            align-items: start;
        }

        .stats-strip {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
        }

        .stat .label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .stat .value {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.8rem;
            color: var(--text);
        }

        .stat[data-level="warn"] .value { color: #E8B45A; }
        .stat[data-level="crit"] .value { color: #E86A6A; }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--border);
        }

        .dot[data-state="up"] { background: #4ADE80; }
        .dot[data-state="down"] { background: #F87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }

        .category { margin-bottom: 28px; }

        .category-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
        }

        .category-head h2 {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
        }

        .category-head .count {
            font-family: var(--mono);
            font-size: 0.65rem;
            color: var(--muted);
            opacity: 0.7;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: border-color 0.15s, background 0.15s, transform 0.15s;
        }

        .card:hover, .card:focus-visible {
            background: var(--surface-hover);
            border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        }

        .card:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .card img, .card .icon-fallback {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .card .icon-fallback {
            border-radius: 6px;
            background: var(--accent-dim);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .card .name {
            font-size: 0.92rem;
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card .port {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.68rem;
            color: var(--muted);
        }

        .card .ext {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .card.hidden { display: none; }

        .empty-state {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 24px 4px;
        }

        .empty-state a { color: var(--accent); text-decoration: none; }
        .empty-state a:hover { text-decoration: underline; }

        aside { min-width: 0; }

        .rail-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .rail-head h2 {
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
        }

        .rail-head a {
            font-size: 0.75rem;
            color: var(--accent);
            text-decoration: none;
        }

        .rail-head a:hover { text-decoration: underline; }

        .news-list {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            overflow: hidden;
        }

        .news-item {
            display: block;
            padding: 11px 14px;
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .news-item:last-child { border-bottom: none; }

        .news-item:hover, .news-item:focus-visible { background: var(--surface-hover); }

        .news-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent-dim); }

        .news-item .news-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .news-item .news-meta {
            display: flex;
            gap: 6px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: 0.65rem;
            color: var(--muted);
        }

        .news-empty {
            padding: 20px 14px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            main { grid-template-columns: 1fr; gap: 32px; }
            .topbar-inner { flex-wrap: wrap; gap: 12px; padding: 12px 20px; }
            .cmdbar { max-width: none; flex-basis: 100%; margin-left: 0; }
            main { padding: 20px 20px 48px; }
            .cmdbar .hint { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="wordmark">
                <h1>Homelab</h1>
                <span class="host">raspberrypi.tailb9a8bb.ts.net</span>
            </div>
            <form class="cmdbar" id="cmdbar" action="http://100.116.81.88:8888/search" method="get">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" name="q" id="q" placeholder="Filter services — Enter searches the web" autocomplete="off">
                <span class="hint"><kbd>/</kbd><kbd>↵ web</kbd></span>
            </form>
        </div>
    </div>

    <main>
        <div class="stats-strip" id="stats-strip" hidden>
            <div class="stat" id="stat-services"><span class="label">Services</span><span class="value">—</span></div>
            <div class="stat" id="stat-cpu"><span class="label">CPU</span><span class="value">—</span></div>
            <div class="stat" id="stat-mem"><span class="label">Memory</span><span class="value">—</span></div>
            <div class="stat" id="stat-disk"><span class="label">Disk</span><span class="value">—</span></div>
            <div class="stat" id="stat-temp"><span class="label">Temp</span><span class="value">—</span></div>
            <div class="stat" id="stat-uptime"><span class="label">Uptime</span><span class="value">—</span></div>
        </div>
        <section id="services"></section>
        <aside>
            <div class="rail-head">
                <h2>Latest from your feeds</h2>
                <a href="http://100.116.81.88:8081" target="_blank" rel="noopener">Open Miniflux →</a>
            </div>
            <div class="news-list" id="news-list">
                <div class="news-empty" id="news-empty">Loading…</div>
            </div>
        </aside>
    </main>

    <script>
        const services = [
            { name: "Postgres", svc: "postgres", port: 5432, logo: "https://cdn.simpleicons.org/postgresql/4169E1", url: "https://raspberrypi.tailb9a8bb.ts.net/postgres", category: "infrastructure" },
            { name: "n8n", svc: "n8n", port: 5678, logo: "https://cdn.simpleicons.org/n8n/ffffff", url: "http://100.116.81.88:5678", category: "automation" },
            { name: "Fabio", svc: "fabio", port: 9999, logo: "https://cdn.simpleicons.org/consul/F24C53", url: "https://raspberrypi.tailb9a8bb.ts.net/fabio", category: "infrastructure" },
            { name: "Mealie", svc: "mealie", port: 9000, logo: "https://cdn.simpleicons.org/mealie/E58325", url: "http://100.116.81.88:9000", category: "apps" },
            { name: "Miniflux", svc: "miniflux", port: 8081, logo: "https://cdn.simpleicons.org/rss/E58325", url: "http://100.116.81.88:8081", category: "apps" },
            { name: "SearXNG", svc: "searxng", port: 8888, logo: "https://cdn.simpleicons.org/searxng/3050ff", url: "http://100.116.81.88:8888", category: "apps" },
            { name: "Audiobookshelf", svc: "audiobookshelf", port: 13378, logo: "https://cdn.simpleicons.org/audiobookshelf/82612C", url: "http://100.116.81.88:13378", category: "media" },
            { name: "Selenium", svc: "selenium", port: 4444, logo: "https://cdn.simpleicons.org/selenium/43B02A", url: "https://raspberrypi.tailb9a8bb.ts.net/selenium", category: "infrastructure" },
            { name: "ChangeDetection", svc: "changedetection", port: 5000, logo: "https://cdn.simpleicons.org/opensourceinitiative/3056d3", url: "http://100.116.81.88:5000", category: "apps" },
            { name: "Beszel", svc: "beszel", port: 8090, logo: "https://cdn.simpleicons.org/lightning/38bdf8", url: "http://100.116.81.88:8090", category: "monitoring" },
            { name: "ConvertX", svc: "convertx", port: 5005, logo: "https://cdn.simpleicons.org/convertio/4ade80", url: "http://100.116.81.88:5005", category: "apps" },
            { name: "Nomad API", svc: "nomad-api", port: 3000, logo: "", url: "https://raspberrypi.tailb9a8bb.ts.net/nomad-api", category: "apps" },
            { name: "Prometheus", svc: "prometheus", port: 9090, logo: "https://cdn.simpleicons.org/prometheus/E6522C", url: "https://raspberrypi.tailb9a8bb.ts.net/prometheus", category: "monitoring" },
            { name: "Node-Exporter", svc: "node-exporter", port: 9100, logo: "https://cdn.simpleicons.org/prometheus/E6522C", url: "https://raspberrypi.tailb9a8bb.ts.net/node-exporter", category: "monitoring" },
            { name: "Ultra.cc", port: null, logo: "https://cdn.simpleicons.org/cloudflare/2563eb", url: "https://ultra.cc", category: "external" },
            { name: "Radarr", port: null, logo: "https://cdn.simpleicons.org/radarr/FFC230", url: "https://seedking.nyx.usbx.me/radarr/", category: "media" },
            { name: "Sonarr", port: null, logo: "https://cdn.simpleicons.org/sonarr/2196F3", url: "https://seedking.nyx.usbx.me/sonarr/", category: "media" }
        ];

        const categoryOrder = ["apps", "automation", "media", "monitoring", "infrastructure", "external"];
        const categoryLabels = {
            apps: "Applications",
            automation: "Automation",
            media: "Media",
            monitoring: "Monitoring",
            infrastructure: "Infrastructure",
            external: "External"
        };

        const grid = document.getElementById('services');
        const input = document.getElementById('q');

        function cardEl(s) {
            const a = document.createElement('a');
            a.className = 'card';
            a.href = s.url;
            a.dataset.name = s.name.toLowerCase();
            if (s.category === 'external' || !s.url.includes('100.116.81.88') && !s.url.includes('tailb9a8bb')) {
                a.target = '_blank';
                a.rel = 'noopener';
            }
            if (s.logo) {
                const img = document.createElement('img');
                img.src = s.logo;
                img.alt = '';
                img.loading = 'lazy';
                img.onerror = () => img.replaceWith(fallbackIcon(s.name));
                a.appendChild(img);
            } else {
                a.appendChild(fallbackIcon(s.name));
            }
            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = s.name;
            a.appendChild(name);
            if (s.port) {
                const port = document.createElement('span');
                port.className = 'port';
                port.textContent = ':' + s.port;
                a.appendChild(port);
            } else {
                const ext = document.createElement('span');
                ext.className = 'ext';
                ext.textContent = '↗';
                a.appendChild(ext);
            }
            if (s.svc) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.dataset.svc = s.svc;
                a.appendChild(dot);
            }
            return a;
        }

        function fallbackIcon(name) {
            const d = document.createElement('span');
            d.className = 'icon-fallback';
            d.textContent = name.slice(0, 2).toUpperCase();
            return d;
        }

        function render() {
            for (const cat of categoryOrder) {
                const items = services
                    .filter(s => s.category === cat)
                    .sort((a, b) => a.name.localeCompare(b.name));
                if (!items.length) continue;
                const section = document.createElement('div');
                section.className = 'category';
                section.dataset.category = cat;
                const head = document.createElement('div');
                head.className = 'category-head';
                const h = document.createElement('h2');
                h.textContent = categoryLabels[cat];
                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = items.length;
                head.append(h, count);
                const g = document.createElement('div');
                g.className = 'service-grid';
                items.forEach(s => g.appendChild(cardEl(s)));
                section.append(head, g);
                grid.appendChild(section);
            }
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.id = 'empty-state';
            empty.hidden = true;
            grid.appendChild(empty);
        }

        function applyFilter() {
            const q = input.value.trim().toLowerCase();
            let visible = 0;
            document.querySelectorAll('.card').forEach(c => {
                const match = !q || c.dataset.name.includes(q);
                c.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            document.querySelectorAll('.category').forEach(sec => {
                sec.style.display = sec.querySelector('.card:not(.hidden)') ? '' : 'none';
            });
            const empty = document.getElementById('empty-state');
            empty.hidden = visible > 0;
            if (!visible) {
                empty.innerHTML = '';
                empty.append('No matching service — press ');
                const k = document.createElement('kbd');
                k.textContent = 'Enter';
                empty.append(k, ' to search the web for “' + input.value.trim() + '”');
            }
        }

        input.addEventListener('input', applyFilter);

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== input) {
                e.preventDefault();
                input.focus();
            } else if (e.key === 'Escape' && document.activeElement === input) {
                input.value = '';
                applyFilter();
                input.blur();
            }
        });

        render();

        // Latest entries via the dashboard's nginx proxy (API key stays server-side)
        function relTime(iso) {
            const mins = Math.round((Date.now() - new Date(iso)) / 60000);
            if (mins < 60) return mins + "m";
            if (mins < 1440) return Math.round(mins / 60) + "h";
            return Math.round(mins / 1440) + "d";
        }

        fetch('/api/miniflux/entries?order=published_at&direction=desc&limit=15')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                const entries = data.entries || [];
                const list = document.getElementById('news-list');
                document.getElementById('news-empty').remove();
                if (!entries.length) {
                    const d = document.createElement('div');
                    d.className = 'news-empty';
                    d.textContent = 'No entries yet — subscribe to feeds in Miniflux.';
                    list.appendChild(d);
                    return;
                }
                for (const e of entries) {
                    const a = document.createElement('a');
                    a.className = 'news-item';
                    a.href = e.url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    const title = document.createElement('span');
                    title.className = 'news-title';
                    title.textContent = e.title;
                    const meta = document.createElement('span');
                    meta.className = 'news-meta';
                    meta.textContent = (e.feed?.title || '') + ' · ' + relTime(e.published_at);
                    a.append(title, meta);
                    list.appendChild(a);
                }
            })
            .catch(() => {
                const el = document.getElementById('news-empty');
                if (el) el.textContent = 'Feeds unavailable right now.';
            });

        // Service health dots via the consul proxy
        function loadHealth() {
            fetch('/api/health')
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(list => {
                    const byName = Object.fromEntries(list.map(s => [s.Name, s]));
                    let up = 0, tracked = 0;
                    document.querySelectorAll('.dot[data-svc]').forEach(dot => {
                        const s = byName[dot.dataset.svc];
                        if (!s) { dot.dataset.state = ''; return; }
                        tracked++;
                        const ok = (s.ChecksCritical || 0) === 0;
                        if (ok) up++;
                        dot.dataset.state = ok ? 'up' : 'down';
                        dot.title = dot.dataset.svc + ': ' + s.ChecksPassing + ' passing' +
                            (s.ChecksCritical ? ', ' + s.ChecksCritical + ' critical' : '');
                    });
                    setStat('stat-services', up + '/' + tracked,
                        up === tracked ? '' : 'crit');
                    document.getElementById('stats-strip').hidden = false;
                })
                .catch(() => {});
        }

        // Host stats via same-origin prometheus (through fabio)
        function promQuery(q) {
            return fetch('/prometheus/api/v1/query?query=' + encodeURIComponent(q))
                .then(r => r.json())
                .then(d => parseFloat(d.data.result[0]?.value[1]));
        }

        function setStat(id, text, level) {
            const el = document.getElementById(id);
            el.querySelector('.value').textContent = text;
            if (level !== undefined) el.dataset.level = level;
        }

        function levelFor(v, warn, crit) {
            return v >= crit ? 'crit' : v >= warn ? 'warn' : '';
        }

        function loadStats() {
            Promise.allSettled([
                promQuery('100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]))*100'),
                promQuery('(1 - node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)*100'),
                promQuery('(1 - node_filesystem_avail_bytes{mountpoint="/"}/node_filesystem_size_bytes{mountpoint="/"})*100'),
                promQuery('max(node_thermal_zone_temp)'),
                promQuery('(node_time_seconds - node_boot_time_seconds)/86400')
            ]).then(([cpu, mem, disk, temp, uptime]) => {
                let any = false;
                if (cpu.status === 'fulfilled' && !isNaN(cpu.value)) {
                    setStat('stat-cpu', cpu.value.toFixed(0) + '%', levelFor(cpu.value, 60, 85)); any = true;
                }
                if (mem.status === 'fulfilled' && !isNaN(mem.value)) {
                    setStat('stat-mem', mem.value.toFixed(0) + '%', levelFor(mem.value, 70, 88)); any = true;
                }
                if (disk.status === 'fulfilled' && !isNaN(disk.value)) {
                    setStat('stat-disk', disk.value.toFixed(0) + '%', levelFor(disk.value, 70, 88)); any = true;
                }
                if (temp.status === 'fulfilled' && !isNaN(temp.value)) {
                    setStat('stat-temp', temp.value.toFixed(0) + '°C', levelFor(temp.value, 65, 78)); any = true;
                }
                if (uptime.status === 'fulfilled' && !isNaN(uptime.value)) {
                    setStat('stat-uptime', uptime.value >= 1 ? uptime.value.toFixed(0) + 'd'
                        : (uptime.value * 24).toFixed(0) + 'h');
                    any = true;
                }
                if (any) document.getElementById('stats-strip').hidden = false;
            });
        }

        loadHealth();
        loadStats();
        setInterval(loadHealth, 30000);
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
