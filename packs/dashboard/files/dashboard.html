<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --card-border: #334155;
            --hover-bg: #334155;
            --transition-speed: 0.2s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        header {
            margin-bottom: 40px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 20px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px 16px 10px 40px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #475569;
            box-shadow: 0 0 0 2px rgba(51, 65, 85, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        h1 { font-weight: 600; font-size: 2.5rem; letter-spacing: -0.03em; color: #f8fafc; }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-family: 'Monaco', monospace;
            opacity: 0.8;
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 6px;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 24px 0 12px 0;
        }

        .category-title:first-of-type { margin-top: 0; }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 850px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 24px; }
            h1 { font-size: 2rem; }
            .search-container { max-width: 100%; order: 3; }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .header-left { flex-direction: column; align-items: flex-start; gap: 10px; }
            .port-tag { opacity: 1; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            transition: all var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            aspect-ratio: 1;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        .card.hidden { display: none; }

        .card:hover {
            transform: translateY(-4px);
            background: var(--hover-bg);
            border-color: #475569;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        .logo-container {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        .logo-fallback {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }

        .card-title { font-size: 1rem; font-weight: 500; margin-bottom: 2px; color: #f1f5f9; text-align: center; }

        .port-tag {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Menlo', 'Monaco', monospace;
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover .port-tag { opacity: 1; }

        .web-search-form {
            position: relative;
            margin-bottom: 32px;
        }

        .web-search-form .search-icon { color: #3050ff; }

        .web-search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px 18px 14px 44px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .web-search-input:focus {
            outline: none;
            border-color: #3050ff;
            box-shadow: 0 0 0 2px rgba(48, 80, 255, 0.25);
        }

        .news-section { margin-top: 40px; }

        .news-section h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .news-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            transition: background var(--transition-speed);
        }

        .news-item:hover { background: var(--hover-bg); }

        .news-item .news-title {
            color: var(--text-color);
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .news-item .news-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            white-space: nowrap;
            font-family: 'Menlo', 'Monaco', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>Homelab</h1>
                <p class="subtitle">raspberrypi.tailb9a8bb.ts.net</p>
            </div>
            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search services...">
            </div>
        </header>
        <form class="web-search-form" action="http://100.116.81.88:8888/search" method="get">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" name="q" class="web-search-input" placeholder="Search the web with SearXNG…" autocomplete="off">
        </form>
        <div id="service-grid"></div>
        <div class="news-section" id="news-section" hidden>
            <h2>Latest from your feeds</h2>
            <div class="news-list" id="news-list"></div>
        </div>
    </div>

    <script>
        const services = [
            { name: "Postgres", port: 5432, logo: "https://cdn.simpleicons.org/postgresql/4169E1", url: "https://raspberrypi.tailb9a8bb.ts.net/postgres", category: "infrastructure" },
            { name: "n8n", port: 5678, logo: "https://cdn.simpleicons.org/n8n/ffffff", url: "http://100.116.81.88:5678", category: "automation" },
            { name: "Fabio", port: 9999, logo: "https://cdn.simpleicons.org/consul/F24C53", url: "https://raspberrypi.tailb9a8bb.ts.net/fabio", category: "infrastructure" },
            { name: "Mealie", port: 9000, logo: "https://cdn.simpleicons.org/mealie/E58325", url: "http://100.116.81.88:9000", category: "apps" },
            { name: "Miniflux", port: 8081, logo: "https://cdn.simpleicons.org/rss/E58325", url: "http://100.116.81.88:8081", category: "apps" },
            { name: "SearXNG", port: 8888, logo: "https://cdn.simpleicons.org/searxng/3050ff", url: "http://100.116.81.88:8888", category: "apps" },
            { name: "Audiobookshelf", port: 13378, logo: "https://cdn.simpleicons.org/audiobookshelf/82612C", url: "http://100.116.81.88:13378", category: "media" },
            { name: "Selenium", port: 4444, logo: "https://cdn.simpleicons.org/selenium/43B02A", url: "https://raspberrypi.tailb9a8bb.ts.net/selenium", category: "infrastructure" },
            { name: "ChangeDetection", port: 5000, logo: "https://cdn.simpleicons.org/opensourceinitiative/3056d3", url: "http://100.116.81.88:5000", category: "apps" },
            { name: "Beszel", port: 8090, logo: "https://cdn.simpleicons.org/lightning/38bdf8", url: "http://100.116.81.88:8090", category: "monitoring" },
            { name: "ConvertX", port: 5005, logo: "https://cdn.simpleicons.org/convertio/4ade80", url: "http://100.116.81.88:5005", category: "apps" },
            { name: "Nomad API", port: 3000, logo: "", url: "https://raspberrypi.tailb9a8bb.ts.net/nomad-api", category: "apps" },
            { name: "Prometheus", port: 9090, logo: "https://cdn.simpleicons.org/prometheus/E6522C", url: "https://raspberrypi.tailb9a8bb.ts.net/prometheus", category: "monitoring" },
            { name: "Node-Exporter", port: 9100, logo: "https://cdn.simpleicons.org/prometheus/E6522C", url: "https://raspberrypi.tailb9a8bb.ts.net/node-exporter", category: "monitoring" },
            { name: "Ultra.cc", port: null, logo: "https://cdn.simpleicons.org/cloudflare/2563eb", url: "https://ultra.cc", category: "external" },
            { name: "Radarr", port: null, logo: "https://cdn.simpleicons.org/radarr/FFC230", url: "https://seedking.nyx.usbx.me/radarr/", category: "media" },
            { name: "Sonarr", port: null, logo: "https://cdn.simpleicons.org/sonarr/2196F3", url: "https://seedking.nyx.usbx.me/sonarr/", category: "media" }
        ];

        const categoryOrder = ["apps", "automation", "media", "monitoring", "infrastructure", "external"];
        const categoryLabels = {
            apps: "Applications",
            automation: "Automation",
            media: "Media",
            monitoring: "Monitoring",
            infrastructure: "Infrastructure",
            external: "External Services"
        };

        // Generate a consistent color from a string
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 60%, 45%)`;
        }

        const grid = document.getElementById('service-grid');
        const searchInput = document.getElementById('search-input');

        function renderServices(filter = '') {
            grid.innerHTML = '';
            const filtered = services.filter(s =>
                s.name.toLowerCase().includes(filter.toLowerCase()) ||
                (s.category && s.category.toLowerCase().includes(filter.toLowerCase()))
            );

            const grouped = {};
            filtered.forEach(s => {
                const cat = s.category || 'apps';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(s);
            });

            categoryOrder.forEach(cat => {
                if (!grouped[cat] || grouped[cat].length === 0) return;

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = categoryLabels[cat] || cat;
                grid.appendChild(title);

                const section = document.createElement('div');
                section.className = 'grid';

                grouped[cat].forEach(service => {
                    const card = document.createElement('a');
                    card.href = service.url;
                    card.target = "_blank";
                    card.className = "card";

                    const logoHtml = service.logo
                        ? `<div class="logo-container"><img src="${service.logo}" alt="${service.name}" onerror="this.parentElement.outerHTML='<div class=\'logo-fallback\' style=\'background:${stringToColor(service.name)}\'>'+' ${service.name[0].toUpperCase()}'+'</div>'"></div>`
                        : `<div class="logo-fallback" style="background:${stringToColor(service.name)}">${service.name[0].toUpperCase()}</div>`;

                    card.innerHTML = `
                        ${logoHtml}
                        <div class="card-title">${service.name}</div>
                        <div class="port-tag">${service.port ? ":" + service.port : "External"}</div>
                    `;
                    section.appendChild(card);
                });

                grid.appendChild(section);
            });
        }

        searchInput.addEventListener('input', (e) => renderServices(e.target.value));
        renderServices();

        // Latest entries via the dashboard's nginx proxy (API key stays server-side)
        function relTime(iso) {
            const mins = Math.round((Date.now() - new Date(iso)) / 60000);
            if (mins < 60) return mins + "m";
            if (mins < 1440) return Math.round(mins / 60) + "h";
            return Math.round(mins / 1440) + "d";
        }

        fetch('/api/miniflux/entries?order=published_at&direction=desc&limit=12')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                const entries = data.entries || [];
                if (!entries.length) return;
                const list = document.getElementById('news-list');
                for (const e of entries) {
                    const a = document.createElement('a');
                    a.className = 'news-item';
                    a.href = e.url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    const title = document.createElement('span');
                    title.className = 'news-title';
                    title.textContent = e.title;
                    const meta = document.createElement('span');
                    meta.className = 'news-meta';
                    meta.textContent = (e.feed?.title || '') + ' · ' + relTime(e.published_at);
                    a.append(title, meta);
                    list.appendChild(a);
                }
                document.getElementById('news-section').hidden = false;
            })
            .catch(() => {});
    </script>
</body>
</html>
