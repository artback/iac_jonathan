version: '3'

# Cluster access: mTLS client certs are fetched to ~/.config/homelab/certs
# (see README "Prerequisites"). Everything below assumes them.
env:
  NOMAD_ADDR: https://100.116.81.88:4646
  NOMAD_CACERT: '{{env "HOME"}}/.config/homelab/certs/nomad-ca.pem'
  NOMAD_CLIENT_CERT: '{{env "HOME"}}/.config/homelab/certs/nomad-cli.pem'
  NOMAD_CLIENT_KEY: '{{env "HOME"}}/.config/homelab/certs/nomad-cli-key.pem'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------- services

  new:service:
    desc: 'Scaffold a vars file for a new service. Usage: task new:service NAME=whoami IMAGE=traefik/whoami PORT=80 [PREFIX=/whoami]'
    requires:
      vars: [NAME, IMAGE, PORT]
    cmds:
      - ./scripts/new-service.sh '{{.NAME}}' '{{.IMAGE}}' '{{.PORT}}' '{{.PREFIX | default ""}}'

  plan:
    desc: 'Dry-run a service deploy. Usage: task plan SERVICE=whoami [PACK=generic]'
    requires:
      vars: [SERVICE]
    cmds:
      - |
        eval "$(./scripts/resolve-service.sh '{{.SERVICE}}' '{{.PACK | default ""}}')"
        nomad-pack plan "packs/$PACK" $VAR_FLAG

  deploy:
    desc: 'Deploy a service. Usage: task deploy SERVICE=whoami [PACK=generic]'
    requires:
      vars: [SERVICE]
    cmds:
      - |
        eval "$(./scripts/resolve-service.sh '{{.SERVICE}}' '{{.PACK | default ""}}')"
        nomad-pack run "packs/$PACK" $VAR_FLAG

  render:
    desc: 'Print the rendered job spec without deploying. Usage: task render SERVICE=whoami'
    requires:
      vars: [SERVICE]
    cmds:
      - |
        eval "$(./scripts/resolve-service.sh '{{.SERVICE}}' '{{.PACK | default ""}}')"
        nomad-pack render "packs/$PACK" $VAR_FLAG

  stop:
    desc: 'Stop and remove a service. Usage: task stop SERVICE=whoami'
    requires:
      vars: [SERVICE]
    cmds:
      - |
        eval "$(./scripts/resolve-service.sh '{{.SERVICE}}' '{{.PACK | default ""}}')"
        nomad-pack destroy "packs/$PACK" $VAR_FLAG

  deploy:all:
    desc: Deploy every service that has a vars file (disaster recovery / full sync)
    cmds:
      - |
        seen=""
        for f in vars/*.hcl; do
          [ -e "$f" ] || continue
          case "$f" in *.example.hcl) continue ;; esac
          name=$(basename "$f" .hcl); name=${name%-kalmar.pkrvars}
          case " $seen " in *" $name "*) continue ;; esac
          seen="$seen $name"
          echo "==> deploying $name"
          eval "$(./scripts/resolve-service.sh "$name" '')"
          nomad-pack run "packs/$PACK" $VAR_FLAG || echo "!! $name failed"
        done

  # ------------------------------------------------------------------ status

  status:
    desc: Show all jobs on the cluster
    cmds:
      - nomad job status

  nodes:
    desc: Show cluster nodes
    cmds:
      - nomad node status

  doctor:
    desc: Check local prerequisites and cluster reachability
    silent: true
    cmds:
      - |
        ok=0; fail=0
        chk() { if eval "$2" >/dev/null 2>&1; then echo "ok   $1"; ok=$((ok+1)); else echo "FAIL $1  ($3)"; fail=$((fail+1)); fi; }
        chk "nomad CLI"        "command -v nomad"       "brew install nomad"
        chk "nomad-pack CLI"   "command -v nomad-pack"  "brew install nomad-pack"
        chk "ansible CLI"      "command -v ansible-playbook" "brew install ansible"
        chk "nomad CA cert"    "test -r \"$NOMAD_CACERT\""      "fetch certs to ~/.config/homelab/certs"
        chk "nomad client cert" "test -r \"$NOMAD_CLIENT_CERT\" -a -r \"$NOMAD_CLIENT_KEY\"" "fetch certs to ~/.config/homelab/certs"
        chk "Nomad API (mTLS)" "nomad status"           "is Tailscale up? certs valid?"
        chk "HTTPS entrypoint" "curl -s -m 8 -o /dev/null https://raspberrypi.tailb9a8bb.ts.net/" "check tailscale serve + fabio on the node"
        echo "----"; echo "$ok ok, $fail failing"
        [ "$fail" -eq 0 ]

  check:
    desc: Validate packs render and Ansible/shell syntax (run before committing)
    cmds:
      - |
        for p in packs/*/; do
          name=$(basename "$p")
          # Dummy values for variables without defaults, so render succeeds.
          case "$name" in
            generic)  flags="-f vars/whoami.example.hcl" ;;
            fabio)    flags="--var service_ip=100.116.81.88" ;;
            mealie)   flags="--var db_postgresdb_root_password=x --var db_postgresdb_password=x" ;;
            postgres) flags="--var pg_version=16 --var pg_password=x --var pg_db_name=x" ;;
            *)        flags="" ;;
          esac
          nomad-pack render "$p" $flags >/dev/null && echo "render ok  $name" || { echo "render FAIL $name"; exit 1; }
        done
      - bash -n scripts/new-service.sh && bash -n scripts/resolve-service.sh && echo "scripts ok"
      - cd ansible && ansible-playbook --syntax-check -i inventory.ini.example playbooks/site.yml >/dev/null && echo "ansible ok"

  # ------------------------------------------------------------------- nodes

  node:ping:
    desc: Ansible ping all inventory hosts
    dir: ansible
    cmds:
      - ansible all -i inventory.ini -m ping

  node:provision:
    desc: 'Provision a node (new or existing). Usage: task node:provision HOST=100.x.y.z (or HOST=all)'
    requires:
      vars: [HOST]
    dir: ansible
    cmds:
      - ansible-playbook -i inventory.ini playbooks/site.yml --limit '{{.HOST}}'
