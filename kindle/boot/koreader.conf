#kate: syntax bash;
description "Start Tailscale and KOReader at boot, and keep KOReader running"

# framework_ready is the same trigger the jailbreak's own bridge job uses:
# the framework must be up before anything takes the framebuffer.
start on framework_ready
stop on stopping framework

script
	LOG=/mnt/us/koreader_boot.log
	FLAG=/mnt/us/no_koreader_autostart

	# Escape hatch. This is the ONLY way back to the Amazon reader, so it
	# has to be reachable without KOReader: create the file over SSH, or
	# over USB/MTP from a computer, then reboot.
	#   touch /mnt/us/no_koreader_autostart
	if [ -f "$FLAG" ] ; then
		echo "$(date): autostart disabled by flag file" >> "$LOG"
		exit 0
	fi

	# Let the framework settle before taking the framebuffer.
	sleep 25

	# Tailscale FIRST, deliberately. It is the recovery path: if KOReader
	# will not stay up, remote access must not fail along with it.
	TS=/mnt/us/extensions/tailscale/bin
	if [ -x "$TS/start_tailscaled_tun.sh" ] ; then
		echo "$(date): starting tailscaled" >> "$LOG"
		"$TS/start_tailscaled_tun.sh" >> "$LOG" 2>&1
		sleep 12
		if [ -x "$TS/start_tailscale.sh" ] ; then
			"$TS/start_tailscale.sh" >> "$LOG" 2>&1
		fi
	fi

	# Respawn loop: quitting KOReader returns to KOReader, not to Amazon.
	quick=0
	while [ ! -f "$FLAG" ] ; do
		echo "$(date): starting KOReader" >> "$LOG"
		started=$(date +%s)
		cd /mnt/us/koreader && ./koreader.sh
		rc=$?
		ran=$(( $(date +%s) - started ))
		echo "$(date): KOReader exited rc=$rc after ${ran}s" >> "$LOG"

		# Crash-loop guard. A normal quit is relaunched at once; but if it
		# keeps dying within seconds, spinning forever would leave a hot,
		# unusable, unreachable device -- so give up and let the Amazon UI
		# come back, which is recoverable.
		if [ "$ran" -lt 15 ] ; then
			quick=$(( quick + 1 ))
		else
			quick=0
		fi
		if [ "$quick" -ge 5 ] ; then
			echo "$(date): 5 rapid exits, giving up to keep the device usable" >> "$LOG"
			break
		fi
		sleep 2
	done
end script
