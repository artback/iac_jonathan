---
- name: Check installed Nomad version
  ansible.builtin.command: /usr/local/bin/nomad version
  register: nomad_installed
  changed_when: false
  failed_when: false

- name: Install Nomad binary
  when:
    - not (nomad_skip_install | bool)
    - nomad_installed.rc != 0 or ("Nomad v" ~ nomad_version) not in nomad_installed.stdout
  block:
    - name: Download Nomad
      ansible.builtin.get_url:
        url: "https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_{{ nomad_arch }}.zip"
        dest: "/tmp/nomad.zip"
        mode: '0644'

    - name: Unzip Nomad
      ansible.builtin.unarchive:
        src: "/tmp/nomad.zip"
        dest: "/usr/local/bin/"
        remote_src: yes
      notify: Restart Nomad

- name: Create Nomad group
  ansible.builtin.group:
    name: nomad
    state: present

- name: Create Nomad user
  ansible.builtin.user:
    name: nomad
    group: nomad
    system: yes
    shell: /bin/false

- name: Create Nomad data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: nomad
    group: nomad
    mode: '0755'
  loop:
    - /etc/nomad.d
    - /opt/nomad/data

- name: Render Nomad config file
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: /etc/nomad.d/nomad.hcl
    owner: nomad
    group: nomad
    mode: '0644'
  when: nomad_manage_config | bool
  notify: Restart Nomad

- name: Create Nomad systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nomad.service
    content: |
      [Unit]
      Description=Nomad
      Documentation=https://www.nomadproject.io/docs/
      Wants=network-online.target
      After=network-online.target

      [Service]
      ExecReload=/bin/kill -HUP $MAINPID
      ExecStart=/usr/local/bin/nomad agent -config /etc/nomad.d
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      StartLimitBurst=3
      StartLimitIntervalSec=10
      TasksMax=infinity
      OOMScoreAdjust=-1000

      [Install]
      WantedBy=multi-user.target
  when: nomad_manage_config | bool
  notify: Restart Nomad

- name: Start Nomad service
  ansible.builtin.service:
    name: nomad
    state: started
    enabled: true
