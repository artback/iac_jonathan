---
# Enable Nomad ACLs.
#
# Without ACLs, Nomad Variables give encryption at rest and keep secrets out of
# job specs, but no access control: any holder of the mTLS client cert reads
# every variable. This closes that gap.
#
# Deliberately NOT part of the role's main.yml — it is opt-in via
# `-e nomad_acl_enable=true`, because it is the one change here that can lock
# you out of your own cluster if the bootstrap token is lost.
#
# Rollback: restore /etc/nomad.d/nomad.hcl.pre-acl and restart nomad. Existing
# allocations keep running throughout; ACLs gate the API, not the schedulers.

- name: Fail early if the operator has not opted in
  ansible.builtin.assert:
    that: nomad_acl_enable | default(false) | bool
    fail_msg: >-
      Refusing to enable ACLs implicitly. Re-run with -e nomad_acl_enable=true
      once you have somewhere safe to put the bootstrap token.

- name: Back up the pre-ACL Nomad config
  ansible.builtin.copy:
    src: /etc/nomad.d/nomad.hcl
    dest: /etc/nomad.d/nomad.hcl.pre-acl
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"

# `enabled = false` occurs exactly once in this file — the acl block. The
# server/client blocks use `enabled = true`, so no after/before scoping is
# needed, and scoping it was in fact the bug: inside the subsection that
# after/before extracts, `^` no longer anchors per line, so the regexp never
# matched and the play reported changed=0 while doing nothing.
- name: Enable ACLs in the live Nomad config
  ansible.builtin.lineinfile:
    path: /etc/nomad.d/nomad.hcl
    regexp: '^\s*enabled\s*=\s*false\s*$'
    line: '  enabled    = true'
    backrefs: false
  notify: Restart Nomad agent

- name: Apply the restart before bootstrapping
  ansible.builtin.meta: flush_handlers

# Deliberately a port check, not an HTTP one. This cluster runs Nomad with
# verify_https_client = true, so every API request needs a *client*
# certificate; `validate_certs: false` only relaxes server verification and
# leaves the handshake failing with TLSV13_ALERT_CERTIFICATE_REQUIRED whether
# or not ACLs are on. Waiting on the listener proves the restart succeeded
# without dragging mTLS material into the play.
- name: Wait for Nomad to listen again after the restart
  ansible.builtin.wait_for:
    host: "{{ resilience_bind_address }}"
    port: 4646
    state: started
    timeout: 120

- name: Confirm the agent is actually up
  ansible.builtin.systemd:
    name: nomad
  register: nomad_unit
  failed_when: nomad_unit.status.ActiveState != "active"

- name: Report that ACLs are live
  ansible.builtin.debug:
    msg: >-
      Nomad ACLs are enabled and the agent is listening. Bootstrap next, from a
      machine holding the client certificate: `nomad acl bootstrap`. Store the
      SecretID immediately — it cannot be retrieved again, and without it the
      cluster cannot be administered.
